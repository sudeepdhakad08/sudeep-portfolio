<header class="sticky top-0 z-50 border-b border-white/10 bg-[#0b1120]">

  <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 md:px-8">

    <!-- Logo -->
    <a
      href="#home"
      (click)="closeMenu()"
      class="whitespace-nowrap text-2xl font-bold text-white"
    >
      Sudeep <span class="text-blue-500">Dhakad</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden items-center gap-6 lg:flex">
      <a href="#home" class="text-sm font-medium text-gray-300 transition-colors hover:text-blue-400">Home</a>
      <a href="#about" class="text-sm font-medium text-gray-300 transition-colors hover:text-blue-400">About</a>
      <a href="#skills" class="text-sm font-medium text-gray-300 transition-colors hover:text-blue-400">Skills</a>
      <a href="#experience" class="text-sm font-medium text-gray-300 transition-colors hover:text-blue-400">Experience</a>
      <a href="#projects" class="text-sm font-medium text-gray-300 transition-colors hover:text-blue-400">Projects</a>
      <a href="#education" class="text-sm font-medium text-gray-300 transition-colors hover:text-blue-400">Education</a>
      <a href="#contact" class="text-sm font-medium text-gray-300 transition-colors hover:text-blue-400">Contact</a>

      <a
        href="resume/Sudeep.pdf"
        target="_blank"
        rel="noopener noreferrer"
        class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700"
      >
        Resume ↗
      </a>
    </nav>

    <!-- Mobile Menu Button -->
    <button
      type="button"
      (click)="isMenuOpen = !isMenuOpen"
      class="rounded-lg border border-white/10 px-3 py-2 text-xl text-white lg:hidden"
      aria-label="Toggle navigation menu"
    >
      ☰
    </button>

  </div>

  <!-- Mobile Menu -->
  @if (isMenuOpen) {
    <nav class="border-t border-white/10 px-5 py-5 lg:hidden">

      <div class="flex flex-col gap-4">

        <a href="#home" (click)="closeMenu()" class="font-medium text-gray-300 transition-colors hover:text-blue-400">
          Home
        </a>

        <a href="#about" (click)="closeMenu()" class="font-medium text-gray-300 transition-colors hover:text-blue-400">
          About
        </a>

        <a href="#skills" (click)="closeMenu()" class="font-medium text-gray-300 transition-colors hover:text-blue-400">
          Skills
        </a>

        <a href="#experience" (click)="closeMenu()" class="font-medium text-gray-300 transition-colors hover:text-blue-400">
          Experience
        </a>

        <a href="#projects" (click)="closeMenu()" class="font-medium text-gray-300 transition-colors hover:text-blue-400">
          Projects
        </a>

        <a href="#education" (click)="closeMenu()" class="font-medium text-gray-300 transition-colors hover:text-blue-400">
          Education
        </a>

        <a href="#contact" (click)="closeMenu()" class="font-medium text-gray-300 transition-colors hover:text-blue-400">
          Contact
        </a>

        <a
          href="resume/Sudeep.pdf"
          target="_blank"
          rel="noopener noreferrer"
          class="mt-2 rounded-lg bg-blue-600 px-5 py-3 text-center font-semibold text-white"
        >
          Resume ↗
        </a>

      </div>

    </nav>
  }

</header>


<home></home>
<about-you></about-you>
<skills></skills>
<experience></experience>
<projects></projects>
<education></education>
<contact></contact>
<app-footer></app-footer>
